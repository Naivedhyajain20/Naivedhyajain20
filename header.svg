<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" xmlns:c2pa="http://c2pa.org/manifest">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07070a"/><stop offset="1" stop-color="#220609"/></linearGradient>
<pattern id="carbon" width="8" height="8" patternUnits="userSpaceOnUse"><rect width="8" height="8" fill="#0d0d12"/><rect width="4" height="4" fill="#16161d"/><rect x="4" y="4" width="4" height="4" fill="#16161d"/></pattern>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<style>
text{font-family:'Arial Black','Segoe UI',Impact,sans-serif;font-style:italic}
.l{filter:url(#glow)}
.l1{animation:o1 8s infinite}.l2{animation:o2 8s infinite}.l3{animation:o3 8s infinite}.l4{animation:o4 8s infinite}.l5{animation:o5 8s infinite}
@keyframes o1{0%,9%{fill:#2a0808}10%,70%{fill:#ff1801}72%,100%{fill:#2a0808}}
@keyframes o2{0%,19%{fill:#2a0808}20%,70%{fill:#ff1801}72%,100%{fill:#2a0808}}
@keyframes o3{0%,29%{fill:#2a0808}30%,70%{fill:#ff1801}72%,100%{fill:#2a0808}}
@keyframes o4{0%,39%{fill:#2a0808}40%,70%{fill:#ff1801}72%,100%{fill:#2a0808}}
@keyframes o5{0%,49%{fill:#2a0808}50%,70%{fill:#ff1801}72%,100%{fill:#2a0808}}
.go{animation:go 8s infinite;opacity:0}
@keyframes go{0%,71%{opacity:0}73%,90%{opacity:1}95%,100%{opacity:0}}
.sp{animation:sp 1.4s linear infinite}
@keyframes sp{from{transform:translateX(1100px)}to{transform:translateX(-400px)}}
.car{animation:drive 6s cubic-bezier(.45,0,.25,1) infinite}
@keyframes drive{0%{transform:translateX(-320px)}100%{transform:translateX(1120px)}}
.wh{transform-box:fill-box;transform-origin:center;animation:spin .35s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.road{stroke-dasharray:30 24;animation:rd .5s linear infinite}
@keyframes rd{to{stroke-dashoffset:-54}}
.t1{animation:in 1.2s ease-out both}
.t2{animation:in 1.2s .4s ease-out both}
@keyframes in{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
.ul{transform-box:fill-box;transform-origin:left;animation:ul 3s ease-in-out infinite}
@keyframes ul{0%{transform:scaleX(0)}50%,85%{transform:scaleX(1)}100%{transform:scaleX(0)}}
.fl{animation:fl 3s steps(1) infinite}
@keyframes fl{0%,92%{opacity:.35}94%{opacity:.8}96%{opacity:.2}98%,100%{opacity:.5}}
</style>
<rect width="1000" height="320" fill="url(#bg)"/>
<rect width="1000" height="320" fill="url(#carbon)" opacity=".5"/>
<rect x="0" y="0" width="1000" height="6" fill="#ff1801"/>
<!-- speed lines -->
<g opacity=".7">
<rect class="sp" y="150" width="220" height="2" fill="#ff1801" style="animation-duration:1.1s"/>
<rect class="sp" y="185" width="140" height="2" fill="#fff" style="animation-duration:1.5s;animation-delay:-.4s" opacity=".5"/>
<rect class="sp" y="215" width="320" height="3" fill="#ff1801" style="animation-duration:.9s;animation-delay:-.2s"/>
<rect class="sp" y="240" width="180" height="2" fill="#fff" style="animation-duration:1.3s;animation-delay:-.8s" opacity=".4"/>
<rect class="sp" y="120" width="260" height="2" fill="#ff1801" style="animation-duration:1.7s;animation-delay:-1s" opacity=".6"/>
</g>
<!-- start lights -->
<rect x="670" y="25" width="300" height="78" rx="14" fill="#0a0a0a" stroke="#2c2c34" stroke-width="2"/>
<circle class="l l1" cx="705" cy="64" r="20" fill="#2a0808"/>
<circle class="l l2" cx="765" cy="64" r="20" fill="#2a0808"/>
<circle class="l l3" cx="825" cy="64" r="20" fill="#2a0808"/>
<circle class="l l4" cx="885" cy="64" r="20" fill="#2a0808"/>
<circle class="l l5" cx="945" cy="64" r="20" fill="#2a0808"/>
<text class="go" x="970" y="132" text-anchor="end" font-size="20" fill="#00e676" font-weight="900" letter-spacing="3">LIGHTS OUT — GO GO GO!</text>
<!-- title -->
<g class="t1">
<text x="60" y="124" font-size="30" fill="#ff1801" letter-spacing="8" font-weight="900">▌ PILOT NO. 20</text>
<text x="60" y="190" font-size="76" fill="#ff1801" class="fl" font-weight="900" transform="translate(3,3)">NAIVEDHYA JAIN</text>
<text x="60" y="190" font-size="76" fill="#ffffff" font-weight="900">NAIVEDHYA JAIN</text>
</g>
<rect class="ul" x="60" y="202" width="420" height="5" fill="#ff1801"/>
<text class="t2" x="62" y="236" font-size="17" fill="#b9b9c4" letter-spacing="4" font-weight="700">FULL STACK DEVELOPER  ·  TEAM OPEN SOURCE  ·  300 KM/H OF CODE</text>
<!-- road -->
<rect y="292" width="1000" height="28" fill="#0a0a0d"/>
<line class="road" x1="0" y1="306" x2="1000" y2="306" stroke="#fff" stroke-width="3" opacity=".7"/>
<!-- car -->
<g transform="translate(0,250)"><g class="car">
<path d="M0,36 L28,32 L70,28 L104,20 L122,8 L146,8 L156,20 L196,26 L226,33 L232,40 L0,40 Z" fill="#ff1801"/>
<path d="M70,31 L196,29 L200,32 L70,34 Z" fill="#fff"/>
<path d="M118,10 Q134,-2 150,10" fill="none" stroke="#222" stroke-width="3"/>
<rect x="124" y="12" width="20" height="9" rx="3" fill="#111"/>
<rect x="-4" y="6" width="22" height="4" fill="#111"/><rect x="2" y="8" width="4" height="30" fill="#111"/>
<rect x="212" y="38" width="30" height="4" fill="#111"/>
<g><circle cx="48" cy="38" r="15" fill="#111"/><g class="wh"><circle cx="48" cy="38" r="8" fill="#ddd"/><rect x="46" y="31" width="4" height="14" fill="#555"/><rect x="41" y="36" width="14" height="4" fill="#555"/></g></g>
<g><circle cx="186" cy="38" r="14" fill="#111"/><g class="wh"><circle cx="186" cy="38" r="7.5" fill="#ddd"/><rect x="184" y="31.5" width="4" height="13" fill="#555"/><rect x="179.5" y="36" width="13" height="4" fill="#555"/></g></g>
</g></g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
