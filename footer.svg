<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 110" width="1000" height="110" xmlns:c2pa="http://c2pa.org/manifest"><style>text{font-family:'Formula1','Titillium Web','Helvetica Neue',Arial,sans-serif;font-weight:800}
.mv{animation:mv 1.4s linear infinite}@keyframes mv{to{transform:translateX(-32px)}}
.mr{animation:mr 1.4s linear infinite}@keyframes mr{from{transform:translateX(-32px)}to{transform:none}}
.p{animation:p 3s ease-in-out infinite}@keyframes p{0%,100%{opacity:.7}50%{opacity:1}}</style>
<defs><pattern id="ck" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#0a0a0c"/><rect width="16" height="16" fill="#f2f2f2"/><rect x="16" y="16" width="16" height="16" fill="#f2f2f2"/></pattern></defs>
<rect width="1000" height="110" fill="#08090c"/>
<g class="mv"><rect width="1100" height="16" fill="url(#ck)"/></g><g class="mr"><rect x="-32" y="94" width="1100" height="16" fill="url(#ck)"/></g>
<text class="p" x="500" y="58" text-anchor="middle" font-size="20" fill="#fff" letter-spacing="9">CHEQUERED FLAG</text>
<text x="500" y="78" text-anchor="middle" font-size="10" fill="#e10600" letter-spacing="6">THANKS FOR VISITING · SEE YOU ON THE GRID</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>