<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07080b" />
      <stop offset="100%" stop-color="#0f1117" />
    </linearGradient>

    <!-- Racing Red Gradient -->
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e10600" />
      <stop offset="100%" stop-color="#ff3b30" />
    </linearGradient>

    <!-- Scan Line Gradient -->
    <linearGradient id="scanBeam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e10600" stop-opacity="0" />
      <stop offset="50%" stop-color="#00f0ff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#e10600" stop-opacity="0" />
    </linearGradient>

    <style>
      text {
        font-family: 'Formula1', 'Titillium Web', 'Segoe UI', -apple-system, sans-serif;
        font-weight: 700;
      }
      
      /* Real-Time Live Recording Dot */
      @keyframes liveBlink {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 6px #ff1801); }
        50% { opacity: 0.2; filter: none; }
      }
      .live-rec { animation: liveBlink 1s infinite ease-in-out; }

      /* Real-Time Telemetry Waveform Oscilloscope Trace */
      @keyframes waveScroll {
        0% { stroke-dashoffset: 2000; }
        100% { stroke-dashoffset: 0; }
      }
      .telemetry-wave {
        stroke-dasharray: 2000;
        animation: waveScroll 5s linear infinite;
      }

      /* Real-Time Dynamic Skill Bars Sweep */
      @keyframes barPulse {
        0% { transform: scaleX(0); }
        18%, 82% { transform: scaleX(1); }
        100% { transform: scaleX(0); }
      }
      .bar-anim {
        transform-box: fill-box;
        transform-origin: left;
        animation: barPulse 6.5s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      }

      /* Live Throttle and Brake Pedals Fluctuations */
      @keyframes pedalThrottle {
        0%, 25% { transform: scaleY(0.95); }
        40% { transform: scaleY(0.2); }
        55% { transform: scaleY(0.08); }
        70%, 100% { transform: scaleY(0.95); }
      }
      @keyframes pedalBrake {
        0%, 30% { transform: scaleY(0.05); }
        45%, 60% { transform: scaleY(0.9); }
        75%, 100% { transform: scaleY(0.05); }
      }
      .pedal-thr {
        transform-box: fill-box;
        transform-origin: bottom;
        animation: pedalThrottle 3.5s ease-in-out infinite;
      }
      .pedal-brk {
        transform-box: fill-box;
        transform-origin: bottom;
        animation: pedalBrake 3.5s ease-in-out infinite;
      }

      /* Real-Time Scanning Sweep */
      @keyframes sweepScan {
        0% { transform: translateX(-1000px); }
        100% { transform: translateX(1000px); }
      }
      .sweep-line { animation: sweepScan 3.2s linear infinite; }

      /* DRS Pulse */
      @keyframes drsGlow {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px #00ff66); }
        50% { opacity: 0.5; filter: none; }
      }
      .drs-badge { animation: drsGlow 1.2s infinite; }
    </style>
  </defs>

  <!-- Background Frame -->
  <rect width="1000" height="320" rx="8" fill="url(#bgGrad)" stroke="#1d1e25" stroke-width="1.8" />
  
  <!-- Laser Scanning Beam -->
  <g clip-path="url(#frameClip)">
    <clipPath id="frameClip">
      <rect width="1000" height="320" rx="8" />
    </clipPath>
    <rect class="sweep-line" y="0" width="1000" height="2" fill="url(#scanBeam)" />
  </g>

  <!-- Top Telemetry Header -->
  <rect width="1000" height="42" rx="8" fill="#0d0f15" />
  <rect width="5" height="42" fill="#e10600" />

  <!-- Live Status & Title -->
  <circle cx="24" cy="21" r="5" fill="#ff1801" class="live-rec" />
  <text x="36" y="26" font-size="12" fill="#ff1801" letter-spacing="3">LIVE ONBOARD TELEMETRY</text>
  <text x="235" y="26" font-size="11" fill="#6f6f7c" letter-spacing="2">· SOURCE: PILOT #20 (NAIVEDHYA JAIN)</text>

  <!-- Right Status Pills -->
  <rect x="745" y="10" width="85" height="22" rx="4" fill="#002b11" stroke="#00ff66" stroke-width="1" />
  <text x="787" y="25" font-size="10" fill="#00ff66" text-anchor="middle" font-weight="900" class="drs-badge" letter-spacing="1">DRS: OPEN</text>

  <rect x="840" y="10" width="140" height="22" rx="4" fill="#1f092b" stroke="#b138ff" stroke-width="1" />
  <text x="910" y="25" font-size="9" fill="#d896ff" text-anchor="middle" font-weight="800" letter-spacing="1">SECTOR: PURPLE (-0.34s)</text>

  <!-- Telemetry Grid Lines -->
  <g opacity=".08" stroke="#ffffff">
    <line x1="100" y1="42" x2="100" y2="320" />
    <line x1="200" y1="42" x2="200" y2="320" />
    <line x1="300" y1="42" x2="300" y2="320" />
    <line x1="400" y1="42" x2="400" y2="320" />
    <line x1="500" y1="42" x2="500" y2="320" />
    <line x1="600" y1="42" x2="600" y2="320" />
    <line x1="700" y1="42" x2="700" y2="320" />
    <line x1="800" y1="42" x2="800" y2="320" />
  </g>

  <!-- Real-Time Speed Waveform Trace (Continuous Moving Oscilloscope) -->
  <path class="telemetry-wave" d="M0,250 C60,250 80,140 140,140 C200,140 220,220 280,220 C340,220 360,110 420,110 C480,110 500,230 560,230 C620,230 640,120 700,120 C760,120 780,210 840,210 C900,210 920,130 1000,130" fill="none" stroke="#e10600" stroke-width="2.2" opacity=".3" />

  <!-- ============================================= -->
  <!-- REAL-TIME SKILL TRACES (NAIVEDHYA'S STACK)    -->
  <!-- ============================================= -->

  <!-- Skill 1: TypeScript / JavaScript -->
  <g transform="translate(0, -5)">
    <text x="30" y="82" font-size="12" fill="#e8e8ee" letter-spacing="2">TYPESCRIPT / JS</text>
    <rect x="230" y="72" width="540" height="10" rx="2" fill="#17181f" />
    <rect class="bar-anim" x="230" y="72" width="507" height="10" rx="2" fill="url(#redGrad)" style="animation-delay: 0.0s;" />
    <rect class="bar-anim" x="230" y="72" width="507" height="2" rx="1" fill="#fff" opacity=".4" style="animation-delay: 0.0s;" />
    <text x="785" y="82" font-size="14" fill="#ffffff" font-family="'Courier New', monospace">94<tspan font-size="9" fill="#6f6f7c">%</tspan></text>
  </g>

  <!-- Skill 2: React / Next.js -->
  <g transform="translate(0, 39)">
    <text x="30" y="82" font-size="12" fill="#e8e8ee" letter-spacing="2">REACT / NEXT.JS</text>
    <rect x="230" y="72" width="540" height="10" rx="2" fill="#17181f" />
    <rect class="bar-anim" x="230" y="72" width="496" height="10" rx="2" fill="url(#redGrad)" style="animation-delay: 0.12s;" />
    <rect class="bar-anim" x="230" y="72" width="496" height="2" rx="1" fill="#fff" opacity=".4" style="animation-delay: 0.12s;" />
    <text x="785" y="82" font-size="14" fill="#ffffff" font-family="'Courier New', monospace">92<tspan font-size="9" fill="#6f6f7c">%</tspan></text>
  </g>

  <!-- Skill 3: C++ (DSA Engine) -->
  <g transform="translate(0, 83)">
    <text x="30" y="82" font-size="12" fill="#e8e8ee" letter-spacing="2">C++ (DSA ENGINE)</text>
    <rect x="230" y="72" width="540" height="10" rx="2" fill="#17181f" />
    <rect class="bar-anim" x="230" y="72" width="475" height="10" rx="2" fill="url(#redGrad)" style="animation-delay: 0.24s;" />
    <rect class="bar-anim" x="230" y="72" width="475" height="2" rx="1" fill="#fff" opacity=".4" style="animation-delay: 0.24s;" />
    <text x="785" y="82" font-size="14" fill="#ffffff" font-family="'Courier New', monospace">88<tspan font-size="9" fill="#6f6f7c">%</tspan></text>
  </g>

  <!-- Skill 4: Node.js & APIs -->
  <g transform="translate(0, 127)">
    <text x="30" y="82" font-size="12" fill="#e8e8ee" letter-spacing="2">NODE.JS &amp; APIS</text>
    <rect x="230" y="72" width="540" height="10" rx="2" fill="#17181f" />
    <rect class="bar-anim" x="230" y="72" width="459" height="10" rx="2" fill="url(#redGrad)" style="animation-delay: 0.36s;" />
    <rect class="bar-anim" x="230" y="72" width="459" height="2" rx="1" fill="#fff" opacity=".4" style="animation-delay: 0.36s;" />
    <text x="785" y="82" font-size="14" fill="#ffffff" font-family="'Courier New', monospace">85<tspan font-size="9" fill="#6f6f7c">%</tspan></text>
  </g>

  <!-- Skill 5: Supabase & DBs -->
  <g transform="translate(0, 171)">
    <text x="30" y="82" font-size="12" fill="#e8e8ee" letter-spacing="2">SUPABASE &amp; SQL</text>
    <rect x="230" y="72" width="540" height="10" rx="2" fill="#17181f" />
    <rect class="bar-anim" x="230" y="72" width="442" height="10" rx="2" fill="url(#redGrad)" style="animation-delay: 0.48s;" />
    <rect class="bar-anim" x="230" y="72" width="442" height="2" rx="1" fill="#fff" opacity=".4" style="animation-delay: 0.48s;" />
    <text x="785" y="82" font-size="14" fill="#ffffff" font-family="'Courier New', monospace">82<tspan font-size="9" fill="#6f6f7c">%</tspan></text>
  </g>

  <!-- ============================================= -->
  <!-- REAL-TIME TELEMETRY HUD: SPEED & PEDALS       -->
  <!-- ============================================= -->
  <g transform="translate(835, 62)">
    <rect x="0" y="0" width="145" height="195" rx="6" fill="#090a0f" stroke="#222533" stroke-width="1.2" />

    <!-- Speed Readout with Live Cycling Numbers -->
    <g transform="translate(14, 40)">
      <text x="0" y="0" font-size="36" fill="#ffffff" font-weight="900" font-family="'Courier New', monospace">
        <animate attributeName="opacity" values="1;0;0;0;1" keyTimes="0;0.25;0.5;0.75;1" dur="3.6s" repeatCount="indefinite" />
        324
      </text>
      <text x="0" y="0" font-size="36" fill="#00f0ff" font-weight="900" font-family="'Courier New', monospace">
        <animate attributeName="opacity" values="0;1;0;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="3.6s" repeatCount="indefinite" />
        335
      </text>
      <text x="0" y="0" font-size="36" fill="#ff1801" font-weight="900" font-family="'Courier New', monospace">
        <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.25;0.5;0.75;1" dur="3.6s" repeatCount="indefinite" />
        342
      </text>
      <text x="0" y="0" font-size="36" fill="#00ff66" font-weight="900" font-family="'Courier New', monospace">
        <animate attributeName="opacity" values="0;0;0;1;0" keyTimes="0;0.25;0.5;0.75;1" dur="3.6s" repeatCount="indefinite" />
        318
      </text>
      <text x="74" y="-8" font-size="10" fill="#e10600" font-weight="900" letter-spacing="1">KM/H</text>
      <text x="74" y="8" font-size="11" fill="#6f6f7c" font-weight="700">GEAR 8</text>
    </g>

    <!-- Throttle & Brake Pedals (Live Animation) -->
    <g transform="translate(14, 62)">
      <!-- Throttle Pedal (Green) -->
      <rect x="0" y="0" width="16" height="55" rx="2" fill="#1b1b22" />
      <rect class="pedal-thr" x="0" y="0" width="16" height="55" rx="2" fill="#00ff66" />
      <text x="8" y="68" font-size="8" fill="#8892b0" text-anchor="middle" font-weight="700">THR</text>

      <!-- Brake Pedal (Red) -->
      <rect x="25" y="0" width="16" height="55" rx="2" fill="#1b1b22" />
      <rect class="pedal-brk" x="25" y="0" width="16" height="55" rx="2" fill="#e10600" />
      <text x="33" y="68" font-size="8" fill="#8892b0" text-anchor="middle" font-weight="700">BRK</text>

      <!-- Telemetry Status Info -->
      <text x="54" y="24" font-size="9" fill="#94a3b8" font-family="monospace">OPTIMAL</text>
      <text x="54" y="38" font-size="12" fill="#b138ff" font-weight="900" font-family="monospace">PURPLE</text>
      <text x="54" y="52" font-size="8" fill="#00ff66" font-family="monospace">STRAT 1</text>
    </g>

    <!-- Bottom Dial -->
    <g transform="translate(14, 155)">
      <text x="0" y="0" font-size="8" fill="#6f6f7c" letter-spacing="1">ENGINE RPM</text>
      <text x="0" y="16" font-size="13" fill="#ffffff" font-family="'Courier New', monospace" font-weight="900">13,200</text>
    </g>
  </g>

  <!-- Bottom Strip -->
  <rect x="0" y="286" width="1000" height="34" fill="#080a0e" />
  <line x1="0" y1="286" x2="1000" y2="286" stroke="#1d1e25" stroke-width="1" />
  <text x="24" y="307" font-size="10" fill="#6f6f7c" letter-spacing="3">REAL-TIME TELEMETRY TRACE • FULL-STACK ALGORITHMIC AERODYNAMICS</text>
  <text x="976" y="307" font-size="10" fill="#e10600" text-anchor="end" letter-spacing="2">LAP 57 // ONBOARD</text>
</svg>